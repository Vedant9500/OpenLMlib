name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Extract release metadata
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *"a"* || "$VERSION" == *"b"* || "$VERSION" == *"rc"* || "$VERSION" == *"dev"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches package version
        shell: bash
        run: |
          # The version is dynamic in pyproject.toml; openlmlib/__init__.py is the source of truth.
          PKG_VERSION="$(tr -d '\r' < openlmlib/__init__.py | sed -n 's/^__version__ = "\(.*\)"$/\1/p' | head -n 1)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$PKG_VERSION" ]; then
            echo "Could not read __version__ from openlmlib/__init__.py" >&2
            exit 1
          fi
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${PKG_VERSION}." >&2
            echo "Update the package version (or the tag) so they match before releasing." >&2
            exit 1
          fi
          echo "Version gate OK: tag ${GITHUB_REF_NAME} == package ${PKG_VERSION}"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Verify distribution contents
        run: |
          unexpected="$(find dist -maxdepth 1 -type f ! -name '*.whl' ! -name '*.tar.gz')"
          if [ -n "$unexpected" ]; then
            echo "dist/ contains files that are not distributions:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

      - name: Generate checksum manifest
        run: |
          sha256sum dist/*.whl dist/*.tar.gz > SHA256SUMS.txt

      - name: Upload distribution artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

      - name: Upload checksum manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checksums
          path: SHA256SUMS.txt

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: needs.build.outputs.prerelease == 'false'
    needs:
      - build
      - publish-testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distribution artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
