name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # One runner per operating system: the OS-compat matrix is what catches
        # path/process/encoding bugs, and Python 3.12 is the baseline version.
        include:
          - name: Ubuntu, Python 3.12
            os: ubuntu-latest
            python-version: "3.12"
          - name: macOS, Python 3.12
            os: macos-latest
            python-version: "3.12"
          - name: Windows, Python 3.12
            os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python scripts/run_tests.py

  unit-tests-arch:
    name: Unit Tests (Arch Linux, Python 3.12+)
    runs-on: ubuntu-latest
    container: archlinux:base-devel

    steps:
      - name: Install system packages
        run: |
          pacman -Syu --noconfirm --needed git python python-pip

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install test dependencies
        # Arch ships a rolling Python and its system interpreter is PEP 668
        # managed, so the tests run inside a venv.
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install --upgrade pip
          .ci-venv/bin/python -m pip install -e ".[dev]"

      - name: Report interpreter version
        run: .ci-venv/bin/python --version

      - name: Run unit tests
        run: .ci-venv/bin/python scripts/run_tests.py

  package-smoke:
    name: Package Build and Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Verify CLI entrypoint
        run: openlmlib --help

      - name: Verify package imports
        run: python -c "import openlmlib; import openlmlib.cli; import openlmlib.mcp_server; print('import-ok')"

  npm-installer-smoke:
    name: npm Installer Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: installer/package-lock.json

      - name: Install npm dependencies
        working-directory: installer
        run: npm ci

      - name: Pack npm tarball
        working-directory: installer
        run: npm pack

      - name: Run installer smoke test
        working-directory: installer
        run: node test-install.js

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: installer/package-lock.json

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit Python dependencies (full resolution)
        # Without --no-deps, pip-audit resolves the full dependency tree in an
        # isolated virtualenv and audits every transitive package.
        run: python -m pip_audit -r requirements.txt

      - name: Audit npm dependencies
        working-directory: installer
        run: npm audit --package-lock-only --audit-level=high
